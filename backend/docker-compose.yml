services:
  postgres:
    image: postgres:16
    container_name: remont-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: remont
      POSTGRES_PASSWORD: remont
      POSTGRES_DB: remont
    ports:
      - "5432:5432"
    volumes:
      - remont_pgdata:/var/lib/postgresql/data

volumes:
  remont_pgdata:
